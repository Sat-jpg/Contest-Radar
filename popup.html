<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contest Radar</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="today" role="tab">Today</button>
      <button class="tab" data-tab="week" role="tab">Week</button>
      <button class="tab" data-tab="all" role="tab">All</button>
    </nav>
    <div class="actions">
      <button id="refresh" class="link-btn" title="Refresh" aria-label="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button id="settings" class="link-btn" title="Settings" aria-label="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="list" aria-live="polite"></main>

  <footer id="status"></footer>

  <template id="row-tpl">
    <article class="row">
      <div class="time"><span class="day"></span><span class="clock"></span></div>
      <div class="body">
        <a class="name" target="_blank" rel="noopener"></a>
        <div class="meta"><span class="site"></span> · <span class="dur"></span><a class="cal" target="_blank" rel="noopener" title="Add to Google Calendar"> · add to calendar</a></div>
      </div>
      <span class="countdown"></span>
    </article>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
